name: npm deprecate (manual)

# One-off ops helper: mark a published create-cartwright version as deprecated
# with a message pointing users forward. Publishes NOTHING — npm deprecate is
# metadata-only and reversible (empty message un-deprecates). Manual dispatch
# only; uses the same NPM_TOKEN as release.yml.
#
# Born 2026-08-27: versions 2.7.10–2.7.13 shipped light scaffolds that fail
# `tsc` out of the box (pruned-module import leaks; fixed in 2.7.14/2.7.15) and
# the local operator has no npm auth — CI is the only holder of the token.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to deprecate (e.g. 2.7.13)"
        required: true
      message:
        description: "Deprecation message (empty string un-deprecates)"
        required: true
        default: "Broken default (light) scaffold: fails typecheck out of the box. Use create-cartwright@latest (>= 2.7.14)."

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Deprecate the version
        run: npm deprecate "create-cartwright@${{ inputs.version }}" "${{ inputs.message }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
