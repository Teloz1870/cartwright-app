name: Release create-cartwright

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    # No if-guard: the Changesets action is internally idempotent — on a
    # release-merge commit it sees no pending changesets and publishes; on
    # a feature commit it opens (or updates) the Version Packages PR; on a
    # no-op commit it exits cleanly. A startsWith("chore: release") guard
    # would (and did, on merge of PR #12) skip the publish run.
    name: Changesets release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter=create-cartwright build

      - name: Create Release PR or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: "chore: release create-cartwright"
          title: "chore: release create-cartwright"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both env-vars peger på samme secret. NODE_AUTH_TOKEN bruges af
          # setup-node's auto-genererede .npmrc (NPM_CONFIG_USERCONFIG); uden
          # det indeholder .npmrc literal placeholder-string "XXXXX-XXXXX..."
          # → publish fejler med E404 undefined. NPM_TOKEN bruges af
          # changesets/action selvstændigt hvis det skal regenerere .npmrc.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Build provenance (SLSA attestation via GitHub OIDC — `id-token: write`
          # above). Tashan (2026-09-13) flagged "no build provenance" as the package's
          # primary weakness; with this, npm shows the artifact traces to this workflow.
          # changesets publishes with `pnpm publish` (native since pnpm 11), and pnpm 11
          # reads only `pnpm_config_*` / `PNPM_CONFIG_*` — NOT `NPM_CONFIG_*`, and not
          # `publishConfig.provenance` either (its publish options come from pnpm's own
          # config; only `publishConfig.registry` is read). This is the knob it honours.
          PNPM_CONFIG_PROVENANCE: "true"
