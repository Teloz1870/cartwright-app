name: Release scaffold gate

# Launch-audit blocker #3 (codex blueprint, 2026-07-15): the deep pre-release
# proof postpublish-smoke deliberately isn't. For every profile this scaffolds
# the CURRENT stable ref exactly like a customer, with full install (which
# runs db:setup + seed on the database-backed profiles), then typecheck →
# unit tests → production build → boots the server and asserts HTTP 200 + a
# rendered H1 (+ seeded admin credentials where a database exists). Run it
# BEFORE tagging an engine release (workflow_dispatch with ref=next tests the
# bleeding edge pre-tag) and weekly as a canary.
#
# postpublish-smoke = fast structural check after npm publish.
# release-scaffold-gate = slow functional proof before/around releases.
#
# It is also the engine's only automated, reproducible measured cold run:
# every leg records per-step wall-clock durations plus the scaffold's
# provenance (CLI version, template channel, the engine's own
# .cartwright/release.json marker, dependency and file counts) into the job
# summary and a `timings-<profile>.json` artifact, and marks the record
# complete only when the whole leg passed. A number cartwright.app quotes is
# copied out of that record — with its date, CLI version, engine ref and run
# id — into the site's constants; the artifact itself expires with the run
# retention, the copied provenance line does not.
#
# NOTE: the `site` leg needs a template ref that ships scaffold/manifest.json
# (engine >= the B3 release) — on older refs the CLI exits with a clear error
# and the leg fails loudly (that is the correct signal, not a flake).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Template channel/ref to test (stable | next | vX.Y.Z)"
        default: "stable"
      cli:
        description: "create-cartwright version to scaffold with (a version, tag or range — passed to npx as-is)"
        default: "latest"
      profile:
        description: "Which leg(s) to run"
        type: choice
        default: "all"
        options: [all, light, full, site]
  schedule:
    - cron: "40 4 * * 1" # Mondays 04:40 UTC — weekly drift canary

permissions:
  contents: read

concurrency:
  # One group per shape: a single-leg dispatch must not cancel the weekly
  # full run that happens to be in flight (and vice versa).
  group: release-scaffold-gate-${{ inputs.profile || 'all' }}
  cancel-in-progress: true

env:
  # This gate scaffolds with --yes, which is exactly what an AI agent does — so
  # without this, every run counts as a customer scaffold in the adoption
  # metric and `profile=site` reads as "number of releases". Never remove.
  CARTWRIGHT_TELEMETRY: "0"

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON((inputs.profile != '' && inputs.profile != 'all') && format('["{0}"]', inputs.profile) || '["light","full","site"]') }}
    name: ${{ matrix.profile }} profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Dispatch inputs reach the shell only through these variables — never
      # interpolated into a `run:` script (GitHub's script-injection guidance).
      PROFILE: ${{ matrix.profile }}
      CLI_INPUT: ${{ inputs.cli || 'latest' }}
      REF_INPUT: ${{ inputs.ref || 'stable' }}
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pre-flight: does the requested CLI exist?
        id: cli
        run: |
          set -euo pipefail
          # The scaffold step passes $CLI_INPUT to npx untouched (a range or a
          # dist-tag works there as it always has). This is only a loud early
          # failure for a typo, and a fallback for the provenance record: the
          # version npx actually EXECUTES is read from the CLI's own banner in
          # scaffold.log below (`npm view` lists a range's matches in
          # publication order, and npx prefers the `latest` tag when it
          # satisfies the range — neither is "the newest match").
          VERSION=$(npm view "create-cartwright@${CLI_INPUT}" version --json | node -e '
            const v = JSON.parse(require("fs").readFileSync(0, "utf8"));
            process.stdout.write(Array.isArray(v) ? v[v.length - 1] : String(v));
          ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "→ create-cartwright@${CLI_INPUT} exists (npm view: $VERSION); template ref: ${REF_INPUT}"

      - name: Scaffold (full install + db:setup + seed)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          START=$(date +%s)
          npx --yes "create-cartwright@${CLI_INPUT}" "gate-${PROFILE}" \
            --yes --db=sqlite --no-ai --no-git --no-start \
            "--profile=${PROFILE}" \
            "--ref=${REF_INPUT}" \
            --pm=pnpm 2>&1 | tee scaffold.log
          echo "DUR_SCAFFOLD=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
          test -d "gate-${PROFILE}"
          # Provenance from the run itself: the version banner the CLI prints
          # (`create-cartwright vX.Y.Z` — the one npx executed) and the channel
          # it resolved. The engine's own marker is read at the end, from the
          # scaffold.
          EXECUTED=$(grep -o 'create-cartwright v[0-9][0-9A-Za-z.+-]*' scaffold.log | head -1 | sed 's/.* v//' || true)
          echo "CLI_EXECUTED=${EXECUTED}" >> "$GITHUB_ENV"
          CHANNEL=$(grep -o 'Template downloaded ([^)]*)' scaffold.log | head -1 | sed 's/.*(\(.*\))/\1/' || true)
          echo "TEMPLATE_CHANNEL=${CHANNEL:-unknown}" >> "$GITHUB_ENV"

      - name: Seeded admin credentials exist
        if: matrix.profile != 'site'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gate-${PROFILE}"
          test -s .admin-credentials || { echo "::error::.admin-credentials missing/empty — db:setup/seed failed"; exit 1; }
          echo "✓ admin seeded"

      - name: Site profile is db-free (B3 materializer proof)
        if: matrix.profile == 'site'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gate-site"
          # No database artifacts may exist in a site materialization.
          for p in prisma lib/db.ts app/admin app/api/auth .admin-credentials; do
            [ ! -e "$p" ] || { echo "::error::site profile still ships $p"; exit 1; }
          done
          # The resolved module graph is recorded (profile.json v2).
          grep -q '"schemaVersion": 2' .cartwright/profile.json
          grep -q '"profile": "site"' .cartwright/profile.json
          # Pruned heavy deps are really gone from package.json — key-anchored
          # (substring grep would false-positive on names like @react-three/*).
          node -e '
            const pkg = require("./package.json");
            const gone = ["prisma","@prisma/client","next-auth","stripe","ai","three","@libsql/client"];
            const tables = [pkg.dependencies ?? {}, pkg.devDependencies ?? {}];
            const leaked = gone.filter((d) => tables.some((t) => d in t));
            if (leaked.length) { console.error("site package.json still lists: " + leaked.join(", ")); process.exit(1); }
            if (pkg.scripts && (pkg.scripts["db:setup"] || pkg.scripts.postinstall)) { console.error("db scripts survived"); process.exit(1); }
          '

          echo "✓ db-free site materialization"

      - name: Typecheck
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gate-${PROFILE}"
          START=$(date +%s); pnpm typecheck; echo "DUR_TYPECHECK=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gate-${PROFILE}"
          START=$(date +%s); pnpm test; echo "DUR_TEST=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"

      - name: Migration baseline verify (engine ≥ v0.40)
        if: matrix.profile != 'site'
        run: cd "$RUNNER_TEMP/gate-${PROFILE}" && pnpm run --if-present db:verify

      - name: Production build
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gate-${PROFILE}"
          START=$(date +%s); pnpm build; echo "DUR_BUILD=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"

      - name: Boot + HTTP 200 + rendered H1
        env:
          # The gate scaffolds --db=sqlite for speed; the engine's production
          # boot guard (launch-hardening) correctly refuses sqlite without
          # this documented escape hatch. Harmless for the db-free site leg.
          ALLOW_SQLITE_IN_PRODUCTION: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gate-${PROFILE}"
          START=$(date +%s)
          (pnpm start > server.log 2>&1 &)
          for i in $(seq 1 60); do
            CODE=$(curl -sL -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          [ "$CODE" = "200" ] || { echo "::error::Homepage never returned 200 (last: $CODE)"; tail -50 server.log; exit 1; }
          # Recorded only once the 200 is real — a timeout is not a boot time.
          echo "DUR_BOOT=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
          H1=$(curl -sL http://localhost:3000/ | grep -o '<h1[^>]*>[^<]*' | head -1)
          [ -n "$H1" ] || { echo "::error::No H1 rendered"; exit 1; }
          echo "✓ 200 + H1: $H1"

      - name: Site profile routes the root to its locale
        if: matrix.profile == 'site'
        run: |
          set -euo pipefail
          # `-L` above hides the redirect. A site scaffold has no root page: `/`
          # must answer with a redirect to the locale home (the CLI patches
          # every scaffold to en-first), and that home must be a real 200 —
          # the two facts the CLI's own next-steps line and the engine's agent
          # briefings state.
          ROOT=$(curl -sI http://localhost:3000/ | tr -d '\r')
          CODE=$(printf '%s\n' "$ROOT" | head -1 | awk '{print $2}')
          LOC=$(printf '%s\n' "$ROOT" | grep -i '^location:' | awk '{print $2}' || true)
          case "$CODE" in 301|302|307|308) ;; *) echo "::error::/ answered $CODE, expected a redirect to the locale home"; exit 1;; esac
          printf '%s' "$LOC" | grep -qE '^(https?://[^/]+)?/en/?$' || { echo "::error::/ redirected to '$LOC', expected /en"; exit 1; }
          HOMEPAGE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/en)
          [ "$HOMEPAGE" = "200" ] || { echo "::error::/en answered $HOMEPAGE"; exit 1; }
          echo "✓ / → $CODE $LOC → 200"

      - name: Identity patched (no template identity leakage)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gate-${PROFILE}"
          grep -q "storeSlug: \"gate-${PROFILE}\"" brand.config.ts \
            || { echo "::error::storeSlug not patched"; exit 1; }
          echo "✓ identity patched"

      - name: Timings + provenance (job summary + artifact)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CLI_VERSION: ${{ steps.cli.outputs.version }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/gate-${PROFILE}"
          MARKER="{}"; DEPS=null; DEVDEPS=null; FILES=null
          if [ -f "$DIR/package.json" ]; then
            [ -f "$DIR/.cartwright/release.json" ] && MARKER=$(cat "$DIR/.cartwright/release.json")
            DEPS=$(node -e 'const p=require(process.argv[1]);console.log(Object.keys(p.dependencies??{}).length)' "$DIR/package.json")
            DEVDEPS=$(node -e 'const p=require(process.argv[1]);console.log(Object.keys(p.devDependencies??{}).length)' "$DIR/package.json")
            FILES=$(cd "$DIR" && find . -type f -not -path './node_modules/*' -not -path './.next/*' | wc -l | tr -d ' ')
          fi
          export MARKER DEPS DEVDEPS FILES
          node -e '
            const env = process.env;
            const n = (v) => (env[v] === undefined ? null : Number(env[v]));
            const num = (v) => (v === "null" || v === undefined ? null : Number(v));
            const steps = { scaffoldInstall: n("DUR_SCAFFOLD"), typecheck: n("DUR_TYPECHECK"), unitTests: n("DUR_TEST"), build: n("DUR_BUILD"), bootTo200: n("DUR_BOOT") };
            // Complete = the leg passed AND every step recorded a duration.
            // Anything else is a partial record: useful for diagnosis, never
            // for quoting.
            const complete = env.JOB_STATUS === "success" && Object.values(steps).every((s) => s !== null);
            let engine = {}; try { engine = JSON.parse(env.MARKER || "{}"); } catch { engine = { unparsable: true }; }
            const out = {
              profile: env.PROFILE,
              cli: env.CLI_EXECUTED || env.CLI_VERSION || null,
              cliSource: env.CLI_EXECUTED ? "banner" : env.CLI_VERSION ? "npm-view" : null,
              cliInput: env.CLI_INPUT, ref: env.REF_INPUT,
              templateChannel: env.TEMPLATE_CHANNEL || "unknown", engine,
              runner: "ubuntu-latest", date: new Date().toISOString().slice(0, 10), runId: env.GITHUB_RUN_ID,
              jobStatus: env.JOB_STATUS, complete, steps,
              scaffold: { dependencies: num(env.DEPS), devDependencies: num(env.DEVDEPS), files: num(env.FILES) },
            };
            require("fs").writeFileSync(`timings-${out.profile}.json`, JSON.stringify(out, null, 2) + "\n");
            const s = out.steps, e = out.engine;
            const row = (k, v) => `| ${k} | ${v ?? "—"} |`;
            const md = [
              `### ${out.profile} — ${complete ? "measured cold run" : `INCOMPLETE record (job ${out.jobStatus}) — do not quote`} (${out.date})`,
              ``, `| step | seconds |`, `|---|---|`,
              row("scaffold + install", s.scaffoldInstall), row("typecheck", s.typecheck), row("unit tests", s.unitTests), row("next build", s.build), row("boot → HTTP 200", s.bootTo200),
              ``, `Provenance: create-cartwright@${out.cli ?? "?"} (${out.cliSource === "banner" ? "executed" : "npm view"}; input \`${out.cliInput}\`) · template ref \`${out.ref}\` (channel ${out.templateChannel}) · engine ${e.version ?? "?"} ${e.commit ? `(${String(e.commit).slice(0, 7)})` : ""} · ${out.scaffold.dependencies ?? "?"} runtime deps / ${out.scaffold.devDependencies ?? "?"} dev · ${out.scaffold.files ?? "?"} files · run ${out.runId}`,
              ``,
            ].join("\n");
            require("fs").appendFileSync(env.GITHUB_STEP_SUMMARY, md);
            console.log(JSON.stringify(out, null, 2));
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.profile }}
          path: timings-${{ matrix.profile }}.json
          retention-days: 90
