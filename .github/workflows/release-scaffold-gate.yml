name: Release scaffold gate

# Launch-audit blocker #3 (codex blueprint, 2026-07-15): the deep pre-release
# proof postpublish-smoke deliberately isn't. For every profile this scaffolds
# the CURRENT stable ref exactly like a customer, with full install (which
# runs db:setup + seed on the database-backed profiles), then typecheck →
# unit tests → production build → boots the server and asserts HTTP 200 + a
# rendered H1 (+ seeded admin credentials where a database exists). Run it
# BEFORE tagging an engine release (workflow_dispatch with ref=next tests the
# bleeding edge pre-tag) and weekly as a canary.
#
# postpublish-smoke = fast structural check after npm publish.
# release-scaffold-gate = slow functional proof before/around releases.
#
# It is also the engine's ONLY measured cold run: every leg records per-step
# wall-clock durations plus the scaffold's provenance (CLI version, template
# channel, the engine's own .cartwright/release.json marker, dependency and
# file counts) into the job summary and a `timings-<profile>.json` artifact.
# Those are the numbers cartwright.app is allowed to quote — always with the
# date, CLI version and engine ref attached, never edited by hand.
#
# NOTE: the `site` leg needs a template ref that ships scaffold/manifest.json
# (engine >= the B3 release) — on older refs the CLI exits with a clear error
# and the leg fails loudly (that is the correct signal, not a flake).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Template channel/ref to test (stable | next | vX.Y.Z)"
        default: "stable"
      cli:
        description: "create-cartwright version to scaffold with"
        default: "latest"
      profile:
        description: "Which leg(s) to run (all | light | full | site)"
        default: "all"
  schedule:
    - cron: "40 4 * * 1" # Mondays 04:40 UTC — weekly drift canary

permissions:
  contents: read

concurrency:
  group: release-scaffold-gate
  cancel-in-progress: true

env:
  # This gate scaffolds with --yes, which is exactly what an AI agent does — so
  # without this, every run counts as a customer scaffold in the adoption
  # metric and `profile=site` reads as "number of releases". Never remove.
  CARTWRIGHT_TELEMETRY: "0"

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON((inputs.profile != '' && inputs.profile != 'all') && format('["{0}"]', inputs.profile) || '["light","full","site"]') }}
    name: ${{ matrix.profile }} profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve the CLI version under test
        id: cli
        run: |
          set -euo pipefail
          VERSION=$(npm view "create-cartwright@${{ inputs.cli || 'latest' }}" version | tail -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "→ create-cartwright@$VERSION, template ref: ${{ inputs.ref || 'stable' }}"

      - name: Scaffold (full install + db:setup + seed)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          START=$(date +%s)
          npx --yes "create-cartwright@${{ steps.cli.outputs.version }}" gate-${{ matrix.profile }} \
            --yes --db=sqlite --no-ai --no-git --no-start \
            --profile=${{ matrix.profile }} \
            --ref=${{ inputs.ref || 'stable' }} \
            --pm=pnpm 2>&1 | tee scaffold.log
          echo "DUR_SCAFFOLD=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
          test -d "gate-${{ matrix.profile }}"
          # Provenance: the channel the CLI resolved, and the engine's own marker.
          CHANNEL=$(grep -o 'Template downloaded ([^)]*)' scaffold.log | head -1 | sed 's/.*(\(.*\))/\1/' || true)
          echo "TEMPLATE_CHANNEL=${CHANNEL:-unknown}" >> "$GITHUB_ENV"

      - name: Seeded admin credentials exist
        if: matrix.profile != 'site'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gate-${{ matrix.profile }}"
          test -s .admin-credentials || { echo "::error::.admin-credentials missing/empty — db:setup/seed failed"; exit 1; }
          echo "✓ admin seeded"

      - name: Site profile is db-free (B3 materializer proof)
        if: matrix.profile == 'site'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gate-site"
          # No database artifacts may exist in a site materialization.
          for p in prisma lib/db.ts app/admin app/api/auth .admin-credentials; do
            [ ! -e "$p" ] || { echo "::error::site profile still ships $p"; exit 1; }
          done
          # The resolved module graph is recorded (profile.json v2).
          grep -q '"schemaVersion": 2' .cartwright/profile.json
          grep -q '"profile": "site"' .cartwright/profile.json
          # Pruned heavy deps are really gone from package.json — key-anchored
          # (substring grep would false-positive on names like @react-three/*).
          node -e '
            const pkg = require("./package.json");
            const gone = ["prisma","@prisma/client","next-auth","stripe","ai","three","@libsql/client"];
            const tables = [pkg.dependencies ?? {}, pkg.devDependencies ?? {}];
            const leaked = gone.filter((d) => tables.some((t) => d in t));
            if (leaked.length) { console.error("site package.json still lists: " + leaked.join(", ")); process.exit(1); }
            if (pkg.scripts && (pkg.scripts["db:setup"] || pkg.scripts.postinstall)) { console.error("db scripts survived"); process.exit(1); }
          '

          echo "✓ db-free site materialization"

      - name: Typecheck
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gate-${{ matrix.profile }}"
          START=$(date +%s); pnpm typecheck; echo "DUR_TYPECHECK=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gate-${{ matrix.profile }}"
          START=$(date +%s); pnpm test; echo "DUR_TEST=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"

      - name: Migration baseline verify (engine ≥ v0.40)
        if: matrix.profile != 'site'
        run: cd "$RUNNER_TEMP/gate-${{ matrix.profile }}" && pnpm run --if-present db:verify

      - name: Production build
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gate-${{ matrix.profile }}"
          START=$(date +%s); pnpm build; echo "DUR_BUILD=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"

      - name: Boot + HTTP 200 + rendered H1
        env:
          # The gate scaffolds --db=sqlite for speed; the engine's production
          # boot guard (launch-hardening) correctly refuses sqlite without
          # this documented escape hatch. Harmless for the db-free site leg.
          ALLOW_SQLITE_IN_PRODUCTION: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gate-${{ matrix.profile }}"
          START=$(date +%s)
          (pnpm start > server.log 2>&1 &)
          for i in $(seq 1 60); do
            CODE=$(curl -sL -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          echo "DUR_BOOT=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
          [ "$CODE" = "200" ] || { echo "::error::Homepage never returned 200 (last: $CODE)"; tail -50 server.log; exit 1; }
          H1=$(curl -sL http://localhost:3000/ | grep -o '<h1[^>]*>[^<]*' | head -1)
          [ -n "$H1" ] || { echo "::error::No H1 rendered"; exit 1; }
          echo "✓ 200 + H1: $H1"

      - name: Site profile routes the root to its locale
        if: matrix.profile == 'site'
        run: |
          set -euo pipefail
          # `-L` above hides the redirect. A site scaffold has no root page: `/`
          # must answer with a redirect to the locale home, and that home must
          # be a real 200 — the exact two facts the docs describe.
          ROOT=$(curl -sI http://localhost:3000/ | tr -d '\r')
          CODE=$(printf '%s\n' "$ROOT" | head -1 | awk '{print $2}')
          LOC=$(printf '%s\n' "$ROOT" | grep -i '^location:' | awk '{print $2}')
          case "$CODE" in 301|302|307|308) ;; *) echo "::error::/ answered $CODE, expected a redirect to the locale home"; exit 1;; esac
          printf '%s' "$LOC" | grep -qE '^(https?://[^/]+)?/en/?$' || { echo "::error::/ redirected to '$LOC', expected /en"; exit 1; }
          HOME=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/en)
          [ "$HOME" = "200" ] || { echo "::error::/en answered $HOME"; exit 1; }
          echo "✓ / → $CODE $LOC → 200"

      - name: Identity patched (no template identity leakage)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gate-${{ matrix.profile }}"
          grep -q 'storeSlug: "gate-${{ matrix.profile }}"' brand.config.ts \
            || { echo "::error::storeSlug not patched"; exit 1; }
          echo "✓ identity patched"

      - name: Timings + provenance (job summary + artifact)
        if: always()
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/gate-${{ matrix.profile }}"
          MARKER="{}"; DEPS=null; DEVDEPS=null; FILES=null
          if [ -d "$DIR" ]; then
            [ -f "$DIR/.cartwright/release.json" ] && MARKER=$(cat "$DIR/.cartwright/release.json")
            DEPS=$(node -e 'const p=require(process.argv[1]);console.log(Object.keys(p.dependencies??{}).length)' "$DIR/package.json")
            DEVDEPS=$(node -e 'const p=require(process.argv[1]);console.log(Object.keys(p.devDependencies??{}).length)' "$DIR/package.json")
            FILES=$(cd "$DIR" && find . -type f -not -path './node_modules/*' -not -path './.next/*' | wc -l | tr -d ' ')
          fi
          node -e '
            const [profile, cli, ref, channel, deps, devDeps, files, marker] = process.argv.slice(1);
            const n = (v) => (process.env[v] === undefined ? null : Number(process.env[v]));
            const out = {
              profile, cli, ref, templateChannel: channel,
              engine: JSON.parse(marker),
              runner: "ubuntu-latest", date: new Date().toISOString().slice(0, 10),
              runId: process.env.GITHUB_RUN_ID, conclusionPartial: false,
              steps: { scaffoldInstall: n("DUR_SCAFFOLD"), typecheck: n("DUR_TYPECHECK"), unitTests: n("DUR_TEST"), build: n("DUR_BUILD"), bootTo200: n("DUR_BOOT") },
              scaffold: { dependencies: deps === "null" ? null : Number(deps), devDependencies: devDeps === "null" ? null : Number(devDeps), files: files === "null" ? null : Number(files) },
            };
            require("fs").writeFileSync(`timings-${profile}.json`, JSON.stringify(out, null, 2) + "\n");
            const s = out.steps, e = out.engine || {};
            const row = (k, v) => `| ${k} | ${v ?? "—"} |`;
            const md = [
              `### ${profile} — measured cold run (${out.date})`,
              ``, `| step | seconds |`, `|---|---|`,
              row("scaffold + install", s.scaffoldInstall), row("typecheck", s.typecheck), row("unit tests", s.unitTests), row("next build", s.build), row("boot → HTTP 200", s.bootTo200),
              ``, `Provenance: create-cartwright@${cli} · template ref \`${ref}\` (channel ${channel}) · engine ${e.version ?? "?"} ${e.commit ? `(${String(e.commit).slice(0, 7)})` : ""} · ${out.scaffold.dependencies ?? "?"} runtime deps / ${out.scaffold.devDependencies ?? "?"} dev · ${out.scaffold.files ?? "?"} files · run ${out.runId}`,
              ``,
            ].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            console.log(JSON.stringify(out, null, 2));
          ' "${{ matrix.profile }}" "${{ steps.cli.outputs.version }}" "${{ inputs.ref || 'stable' }}" "${TEMPLATE_CHANNEL:-unknown}" "$DEPS" "$DEVDEPS" "$FILES" "$MARKER"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.profile }}
          path: timings-${{ matrix.profile }}.json
          retention-days: 90
