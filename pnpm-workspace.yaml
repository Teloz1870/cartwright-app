packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Voice-shop deps (used by cartwright-template's voice client). Eksplicit
  # false → spring postinstall over uden hard error i Vercel-build.
  "@google/genai": false
  protobufjs: false

minimumReleaseAgeExclude:
  # next 16.4.1 (published 2026-10-14T17:43Z) fixes GHSA-673q-mjm6-r5xr
  # (critical: RCE in `use cache` functions returning typed arrays),
  # GHSA-2464-fhr4-w9xw (critical: RCE in Image Optimization with SVG files)
  # and GHSA-p3m5-59mp-jv5r (high: App Router DoS via Server Actions). This site
  # has no `use cache`, no `dangerouslyAllowSVG` and no `"use server"` file, so
  # none is shown reachable — upgraded regardless (the engine's CW-2026-009).
  # Too young for pnpm's release-age cutoff; these twelve exact versions are the
  # release and the packages it pins; drop them once 16.4.1 is older than it.
  - next@16.4.1
  - eslint-config-next@16.4.1
  - "@next/env@16.4.1"
  - "@next/eslint-plugin-next@16.4.1"
  - "@next/swc-darwin-arm64@16.4.1"
  - "@next/swc-darwin-x64@16.4.1"
  - "@next/swc-linux-arm64-gnu@16.4.1"
  - "@next/swc-linux-arm64-musl@16.4.1"
  - "@next/swc-linux-x64-gnu@16.4.1"
  - "@next/swc-linux-x64-musl@16.4.1"
  - "@next/swc-win32-arm64-msvc@16.4.1"
  - "@next/swc-win32-x64-msvc@16.4.1"
  - fumadocs-core@16.8.12
  - fumadocs-mdx@15.0.7
  - fumadocs-ui@16.8.12

# pnpm v11+ requires explicit approval for packages with build-scripts.
# Listed packages run their postinstall; un-listed packages skip.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Embed README.md content into the published manifest (the registry "readme"
# field npmjs.com renders). pnpm defaults this OFF — npm always embeds it —
# which is why every create-cartwright version shipped with an empty readme
# on npmjs.com despite README.md being inside the tarball.
embedReadme: true

# Security overrides (RAD0-app, 2026-09-14): transitive advisories reachable from
# apps/web (fast-uri via @google/genai + MCP SDK; sharp/postcss/browserslist via
# next's own graph) and dev tooling (nanoid, vite, js-yaml). Every value is a
# caret on the patched release, selected per major where a consumer pins one:
# a `>=` floor resolves to the HIGHEST version, so `js-yaml: ">=3.15.2"` put a
# `^3` consumer on 4.1.1 (which removed `safeLoad`) and would have put fumadocs
# on 5.x. The Tuesday currency PR moves majors on purpose; this block only
# closes advisories.
overrides:
  "fast-uri@3": "^3.1.6"
  sharp: "^0.35.5"
  postcss: "^8.5.18"
  browserslist: "^4.28.7"
  "nanoid@3": "^3.3.18"
  "js-yaml@4": "^4.3.2"
  "js-yaml@3": "^3.15.2"
  vite: "^8.0.16"
  # 2026-10-08 (APP-CURRENCY-1, security half): the critical and the three
  # highs in `pnpm audit --prod`. proxy-addr GHSA-jqcg-44mw-7w3h (critical,
  # express under the MCP SDK — this site never runs express); sharp
  # GHSA-wq5f-xc86-pv6w (selector above, librsvg); source-map-js
  # GHSA-68fv-2mgg-jv7q (next > postcss, build time). The MCP SDK advisory
  # (GHSA-6qxp-vccf-f47h) is closed by apps/web's direct dependency, pinned to
  # 1.32.0 (1.32.1 was younger than three days on 2026-10-08).
  "proxy-addr@2": "^2.0.8"
  "source-map-js@1": "^1.2.2"
