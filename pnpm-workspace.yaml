packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Voice-shop deps (used by cartwright-template's voice client). Eksplicit
  # false → spring postinstall over uden hard error i Vercel-build.
  "@google/genai": false
  protobufjs: false

# Supply-chain cooldown, the engine's floor: pnpm refuses a version published
# less than three days (4320 minutes) ago, so a compromised release that is
# pulled within days never reaches this repo. pnpm 11 already waits one day by
# default; setting the key also turns on minimumReleaseAgeStrict, so a version
# younger than the cutoff fails the install (frozen or not) instead of slipping
# in. A security fix that cannot wait goes in minimumReleaseAgeExclude as an
# exact version, dated, with its advisory next to it; drop it once it is older.
minimumReleaseAge: 4320

# pnpm v11+ requires explicit approval for packages with build-scripts.
# Listed packages run their postinstall; un-listed packages skip.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Embed README.md content into the published manifest (the registry "readme"
# field npmjs.com renders). pnpm defaults this OFF — npm always embeds it —
# which is why every create-cartwright version shipped with an empty readme
# on npmjs.com despite README.md being inside the tarball.
embedReadme: true

# Security overrides (RAD0-app, 2026-09-14): transitive advisories reachable from
# apps/web (fast-uri via @google/genai + MCP SDK; sharp/postcss/browserslist via
# next's own graph) and dev tooling (nanoid, vite, js-yaml). Every value is a
# caret on the patched release, selected per major where a consumer pins one:
# a `>=` floor resolves to the HIGHEST version, so `js-yaml: ">=3.15.2"` put a
# `^3` consumer on 4.1.1 (which removed `safeLoad`) and would have put fumadocs
# on 5.x. The Tuesday currency PR moves majors on purpose; this block only
# closes advisories.
overrides:
  "fast-uri@3": "^3.1.8"
  sharp: "^0.35.5"
  postcss: "^8.5.18"
  browserslist: "^4.28.7"
  "nanoid@3": "^3.3.18"
  "js-yaml@4": "^4.3.2"
  "js-yaml@3": "^3.15.2"
  vite: "^8.3.3"
  # 2026-10-08 (APP-CURRENCY-1, security half): the critical and the three
  # highs in `pnpm audit --prod`. proxy-addr GHSA-jqcg-44mw-7w3h (critical,
  # express under the MCP SDK — this site never runs express); sharp
  # GHSA-wq5f-xc86-pv6w (selector above, librsvg); source-map-js
  # GHSA-68fv-2mgg-jv7q (next > postcss, build time). The MCP SDK advisory
  # (GHSA-6qxp-vccf-f47h) is closed by apps/web's direct dependency, pinned to
  # 1.32.0 (1.32.1 was younger than three days on 2026-10-08).
  "proxy-addr@2": "^2.0.8"
  "source-map-js@1": "^1.2.2"
  # 2026-10-22 (security sweep after the October wave): every advisory
  # `pnpm audit --prod` still listed, closed on its own major. vite 8.3.3
  # (above) closes the high GHSA-587h-7wmj-h5pm (launch-editor, Windows dev
  # server only) and its five moderates; fast-uri 3.1.8 (above) closes
  # GHSA-hrr3-gc8f-f4qj. dompurify (mermaid's sanitizer, nine advisories),
  # protobufjs (@google/genai), qs/hono/ip-address (the MCP SDK's express
  # stack), esbuild (fumadocs-mdx, build time), @babel/core (next's toolchain).
  # mermaid itself is a direct dependency of apps/web and is raised there.
  # Left open on purpose: katex GHSA-238p-pmpm-9mq7 (low) — its fix is 0.18,
  # mermaid 11.16.1 still asks for ^0.16, and a 0.x minor is a breaking jump.
  "dompurify@3": "^3.4.16"
  "protobufjs@7": "^7.6.5"
  "qs@6": "^6.16.0"
  "ip-address@10": "^10.7.1"
  "esbuild@>=0.28.0 <0.28.1": "^0.28.1"
  "@babel/core@7": "^7.29.6"
  # 2026-11-27 (APP-SEC-2026-11-27): the two highs and the hono moderates in
  # `pnpm audit --prod`, mirroring the engine's overrides for the same
  # advisories. zod GHSA-mrhx-c7xc-m3w5 (high, every zod below 4.6.6): apps/web,
  # apps/cli and packages/shared now ask for ^4.6.7 directly; this selector
  # lifts the copies fumadocs-mdx and the MCP SDK resolve themselves. The MCP
  # route is public, so this one is treated as reachable. body-parser
  # GHSA-27r3-jxmh-p828 (high) and hono/@hono/node-server (seven moderates, one
  # low) sit in the MCP SDK's express and Node transport, which this site never
  # imports (it uses only the web-standard transport). Each selector covers
  # the whole range its advisories name, not one major. hono's reach below
  # 4.13.16 and back through 3.x. @hono/node-server's cover every 1.x: below
  # 1.19.10 GHSA-wc8c-qw6v-h7f6 (high) and GHSA-jpvv-r467-5p4w, from 1.19.10
  # GHSA-rmxm-3fg6-px4f, which has no 1.x fix, so even 1.19.18 (jpvv's 1.x
  # fix) is not clean. Neither ships a clean line below the current one, so a
  # consumer on an older line is lifted across it on purpose. body-parser
  # does ship one: GHSA-27r3-jxmh-p828 is fixed on 1.x in 1.20.9, so 1.x stays
  # on 1.x. Today only hono 4, @hono/node-server 2 and body-parser 2 are in
  # the lockfile.
  # zod's selector starts at 4.0.0, as the engine's does: zod 3 to 4 is an API
  # break, and no zod 3 is in the lockfile. Drop each once its parent ships
  # the patched line itself.
  "zod@>=4.0.0 <4.6.6": "^4.6.7"
  "body-parser@<1.20.9": "^1.20.9"
  "body-parser@>=2.0.0 <2.4.0": "^2.4.0"
  "hono@<4.13.16": "^4.13.16"
  "@hono/node-server@<2.1.6": "^2.1.6"
