packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Voice-shop deps (used by cartwright-template's voice client). Eksplicit
  # false → spring postinstall over uden hard error i Vercel-build.
  "@google/genai": false
  protobufjs: false

minimumReleaseAgeExclude:
  - fumadocs-core@16.8.12
  - fumadocs-mdx@15.0.7
  - fumadocs-ui@16.8.12

# pnpm v11+ requires explicit approval for packages with build-scripts.
# Listed packages run their postinstall; un-listed packages skip.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Embed README.md content into the published manifest (the registry "readme"
# field npmjs.com renders). pnpm defaults this OFF — npm always embeds it —
# which is why every create-cartwright version shipped with an empty readme
# on npmjs.com despite README.md being inside the tarball.
embedReadme: true

# Security overrides (RAD0-app, 2026-09-14): transitive advisories reachable from
# apps/web (fast-uri via @google/genai + MCP SDK; sharp/postcss/browserslist via
# next's own graph) and dev tooling (nanoid, vite, js-yaml). `tar` is a belt-and-
# braces pin: giget 3 no longer depends on it, but nothing else may drag 6.x back.
overrides:
  fast-uri: ">=3.1.6"
  sharp: ">=0.35.4"
  postcss: ">=8.5.18"
  browserslist: ">=4.28.7"
  nanoid: ">=3.3.18"
  "js-yaml@4": "^4.3.2"
  "js-yaml@3": "^3.15.2"
  vite: ">=8.0.16"
  tar: ">=7.5.22"
